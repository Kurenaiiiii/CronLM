[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronlm"
version = "1.0.0"
description = "Tiny char-level transformer that turns plain English scheduling phrases into 5-field cron expressions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Deliberately NOT pinned here: torch is installed separately (see README Quick start),
# because the right wheel differs per platform and the GTX 1650 needs the CUDA build.
dependencies = [
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cronlm = "cronlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
